# Build -> Dev Deploy -> Prod Deploy
# Flux deploys from Git; the pipeline updates tags and checks rollout.
# orders-api-config must contain the secret variable GITHUB_PAT.
# Production approval is configured on the orders-prod environment.

trigger:
  batch: true
  branches:
    include:
    - main
  paths:
    include:
    - app/**
    - scripts/**
    - azure-pipelines.yml

pr: none

pool:
  vmImage: ubuntu-latest

variables:
- group: orders-api-config
- name: azureServiceConnection
  value: sc-azure-orders
- name: acrName
  value: acrthivagarorders2026
- name: imageRepository
  value: orders-api
- name: imageTag
  value: ado-$(Build.BuildId)
- name: aksResourceGroup
  value: rg-orders-demo
- name: aksName
  value: aks-orders-demo
- name: repoSlug
  value: Thivagar007/orders-api-gitops

stages:
# ---------------------------------------------------------------
# BUILD
# ---------------------------------------------------------------
- stage: Build
  displayName: 'Build, scan and push image'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: BuildJob
    displayName: 'Docker build, Trivy scan and ACR push'
    steps:
    - checkout: self

    - bash: |
        set -euo pipefail
        docker build \
          --label "org.opencontainers.image.revision=$(Build.SourceVersion)" \
          --label "org.opencontainers.image.source=$(Build.Repository.Uri)" \
          -t "$(acrName).azurecr.io/$(imageRepository):$(imageTag)" \
          app
      displayName: 'Build Docker image'

    - bash: |
        set -euo pipefail
        curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin
        trivy --version
      displayName: 'Install Trivy'

    - bash: |
        set -euo pipefail
        IMAGE="$(acrName).azurecr.io/$(imageRepository):$(imageTag)"
        mkdir -p "$(Build.ArtifactStagingDirectory)/trivy"
        echo '##vso[task.setvariable variable=trivyReportDirectoryReady]true'

        trivy image --no-progress --exit-code 0 --format json \
          --output "$(Build.ArtifactStagingDirectory)/trivy/report.json" "$IMAGE"

        echo 'Report: fixable HIGH and CRITICAL vulnerabilities'
        trivy image --no-progress --severity HIGH,CRITICAL \
          --ignore-unfixed --exit-code 0 "$IMAGE"

        echo 'Gate: fail on fixable CRITICAL vulnerabilities'
        trivy image --no-progress --severity CRITICAL \
          --ignore-unfixed --exit-code 1 "$IMAGE"
      displayName: 'Scan image and enforce vulnerability gate'

    - task: PublishPipelineArtifact@1
      displayName: 'Save Trivy report'
      condition: and(succeededOrFailed(), eq(variables['trivyReportDirectoryReady'], 'true'))
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/trivy'
        artifact: trivy-report

    - task: AzureCLI@2
      displayName: 'Push scanned image to ACR'
      inputs:
        azureSubscription: ${{ variables.azureServiceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          az acr login --name "$(acrName)"
          docker push "$(acrName).azurecr.io/$(imageRepository):$(imageTag)"

# ---------------------------------------------------------------
# DEV DEPLOY
# ---------------------------------------------------------------
- stage: DeployDev
  displayName: 'Deploy to dev (GitOps)'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployDev
    displayName: 'Promote image to dev'
    environment: orders-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none

          - checkout: self
            fetchDepth: 0
            persistCredentials: false

          - bash: |
              set -euo pipefail
              bash scripts/update-image-tag.sh dev "$(imageTag)"
            displayName: 'Commit dev image tag to GitHub main'
            env:
              GITHUB_PAT: $(GITHUB_PAT)
              REPO_SLUG: $(repoSlug)

          - task: AzureCLI@2
            displayName: 'Verify Flux deployment in dev'
            inputs:
              azureSubscription: ${{ variables.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                if ! command -v kubectl >/dev/null || ! command -v kubelogin >/dev/null; then
                  sudo az aks install-cli --only-show-errors
                fi

                az aks get-credentials \
                  -g "$(aksResourceGroup)" \
                  -n "$(aksName)" \
                  --overwrite-existing

                kubelogin convert-kubeconfig -l azurecli
                bash scripts/wait-for-rollout.sh dev orders-api "$(imageTag)"

                CURRENT_IMAGE=$(kubectl get deployment orders-api -n dev -o jsonpath='{.spec.template.spec.containers[0].image}')
                test "$CURRENT_IMAGE" = "$(acrName).azurecr.io/$(imageRepository):$(imageTag)"

# ---------------------------------------------------------------
# PROD DEPLOY — environment approval required
# ---------------------------------------------------------------
- stage: DeployProd
  displayName: 'Deploy to prod (approval required)'
  dependsOn: DeployDev
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployProd
    displayName: 'Promote the same image to prod'
    environment: orders-prod
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none

          - checkout: self
            fetchDepth: 0
            persistCredentials: false

          - bash: |
              set -euo pipefail
              bash scripts/update-image-tag.sh prod "$(imageTag)"
            displayName: 'Commit prod image tag after approval'
            env:
              GITHUB_PAT: $(GITHUB_PAT)
              REPO_SLUG: $(repoSlug)

          - task: AzureCLI@2
            displayName: 'Verify Flux deployment in prod'
            inputs:
              azureSubscription: ${{ variables.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                if ! command -v kubectl >/dev/null || ! command -v kubelogin >/dev/null; then
                  sudo az aks install-cli --only-show-errors
                fi

                az aks get-credentials \
                  -g "$(aksResourceGroup)" \
                  -n "$(aksName)" \
                  --overwrite-existing

                kubelogin convert-kubeconfig -l azurecli
                bash scripts/wait-for-rollout.sh prod orders-api "$(imageTag)"

                CURRENT_IMAGE=$(kubectl get deployment orders-api -n prod -o jsonpath='{.spec.template.spec.containers[0].image}')
                test "$CURRENT_IMAGE" = "$(acrName).azurecr.io/$(imageRepository):$(imageTag)"